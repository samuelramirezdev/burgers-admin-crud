<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burgers & Co. — Panel de Administración</title>
  <meta name="description" content="Panel interno para gestionar el menú, el stock y los precios de Burgers & Co.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="admin-header">
    <p class="logo">Burgers<span>&</span>Co. <span class="logo-tag">Admin</span></p>
    <p class="header-role">Cocina &amp; Caja</p>
  </header>

  <main class="admin-main">

    <!-- ============ PANEL DE MÉTRICAS ============ -->
    <section class="metrics" aria-label="Resumen del menú">
      <article class="metric-card metric-card--mustard">
        <p class="metric-label">Productos en el menú</p>
        <p class="metric-value" id="metricTotalProducts">0</p>
      </article>

      <article class="metric-card metric-card--chili">
        <p class="metric-label">Valor total del inventario</p>
        <p class="metric-value" id="metricInventoryValue">$0</p>
      </article>

      <article class="metric-card metric-card--mustard">
        <p class="metric-label">Unidades en stock</p>
        <p class="metric-value" id="metricTotalStock">0</p>
      </article>
    </section>

    <div class="dashboard-grid">

      <!-- ============ FORMULARIO: AGREGAR / EDITAR PRODUCTO ============ -->
      <section class="panel form-panel" aria-labelledby="formTitle">
        <h2 id="formTitle">Agregar producto</h2>

        <form id="productForm" novalidate>
          <!-- Campo oculto: guarda el id del producto cuando se está editando -->
          <input type="hidden" id="productId">

          <label for="productName">Nombre del producto</label>
          <input type="text" id="productName" name="productName" placeholder="Ej. Bacon Smash" required>

          <label for="productCategory">Categoría</label>
          <select id="productCategory" name="productCategory" required>
            <option value="Hamburguesas">Hamburguesas</option>
            <option value="Acompañamientos">Acompañamientos</option>
            <option value="Bebidas">Bebidas</option>
          </select>

          <div class="form-row">
            <div class="form-field">
              <label for="productPrice">Precio (COP)</label>
              <input type="number" id="productPrice" name="productPrice" min="0" step="500" placeholder="18000" required>
            </div>
            <div class="form-field">
              <label for="productStock">Stock disponible</label>
              <input type="number" id="productStock" name="productStock" min="0" step="1" placeholder="25" required>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">Agregar producto</button>
            <button type="button" class="btn btn-ghost" id="cancelEditBtn" hidden>Cancelar edición</button>
          </div>
        </form>
      </section>

      <!-- ============ TABLA DE PRODUCTOS ============ -->
      <section class="panel table-panel" aria-labelledby="tableTitle">
        <div class="table-panel-head">
          <h2 id="tableTitle">Menú actual</h2>

          <!-- Barra de búsqueda: filtra la tabla en tiempo real por nombre o categoría -->
          <div class="search-box">
            <label for="searchInput" class="sr-only">Buscar producto</label>
            <input type="search" id="searchInput" placeholder="Buscar por nombre o categoría…">
          </div>
        </div>

        <div class="table-scroll">
          <table class="product-table">
            <thead>
              <tr>
                <th scope="col">Producto</th>
                <th scope="col">Categoría</th>
                <th scope="col">Precio</th>
                <th scope="col">Stock</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <!-- Las filas se generan dinámicamente desde script.js -->
            <tbody id="productTableBody"></tbody>
          </table>

          <p class="table-empty" id="tableEmpty" hidden>No hay productos que coincidan con tu búsqueda.</p>
        </div>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
